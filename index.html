<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>Slope Sentinel — AI-Powered Landslide Early Warning | SIH 2026</title>
    <meta name="description" content="Fusing physics-informed machine learning with real-time GIS telemetry to provide India's NER region with fail-safe, localized landslide warning windows. SIH 2026 Prototype." />
    <meta name="keywords" content="landslide, early warning, GIS, machine learning, SIH 2026, NER, slope stability" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="Slope Sentinel — AI-Powered Landslide Early Warning" />
    <meta property="og:description" content="Predicting slope failure before the fracture. Real-time GIS telemetry meets physics-informed ML." />
    <meta property="og:type" content="website" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="" />

    <!-- Suppress Netlify Injected Widgets -->
    <style>
      netlify-drawer,
      #netlify-drawer,
      iframe#netlify-drawer,
      iframe[title*="Netlify"],
      [data-netlify-drawer],
      .netlify-badge,
      [class*="netlify"],
      div[style*="fixed"][style*="bottom"]:has(a[href*="netlify.com"]),
      a[href*="netlify.com"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (function() {
        function removeNetlifyBadge() {
          const els = document.querySelectorAll(
            'netlify-drawer, #netlify-drawer, iframe#netlify-drawer, iframe[title*="Netlify"], [data-netlify-drawer], .netlify-badge, [class*="netlify-badge"], [class*="netlify"]'
          );
          els.forEach(el => el.remove());
          document.querySelectorAll('a[href*="netlify.com"]').forEach(a => {
            const box = a.closest('div[style*="fixed"]') || a;
            box.remove();
          });
        }
        window.addEventListener('DOMContentLoaded', removeNetlifyBadge);
        window.addEventListener('load', removeNetlifyBadge);
        const timer = setInterval(removeNetlifyBadge, 250);
        setTimeout(() => clearInterval(timer), 10000);
      })();
    </script>
  </body>
</html>
